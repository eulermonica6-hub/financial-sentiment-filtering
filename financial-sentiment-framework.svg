<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#000"/></marker>
    <style>
      .b{fill:#fff;stroke:#000;stroke-width:2}.l{fill:none;stroke:#000;stroke-width:2;marker-end:url(#a)}
      .t{font-family:Arial,sans-serif;fill:#000}.h{font-size:17px;font-weight:700}.p{font-size:14px}.s{font-size:12px}
    </style>
  </defs>
  <rect width="1200" height="680" fill="#fff"/>
  <text x="600" y="42" text-anchor="middle" class="t h">FROM NEWS NOISE TO MARKET SIGNAL</text>
  <text x="600" y="66" text-anchor="middle" class="t s">A causal filtering pipeline for financial sentiment prediction</text>

  <rect x="55" y="125" width="235" height="125" class="b"/>
  <text x="172" y="158" text-anchor="middle" class="t h">NEWS FIELD</text>
  <text x="172" y="187" text-anchor="middle" class="t p">articles</text>
  <text x="172" y="213" text-anchor="middle" class="t p">language</text>
  <text x="172" y="239" text-anchor="middle" class="t p">market context</text>

  <rect x="335" y="125" width="235" height="125" class="b"/>
  <text x="452" y="158" text-anchor="middle" class="t h">SENTIMENT SPACE</text>
  <text x="452" y="187" text-anchor="middle" class="t p">tone</text>
  <text x="452" y="213" text-anchor="middle" class="t p">disagreement</text>
  <text x="452" y="239" text-anchor="middle" class="t p">polarity</text>

  <rect x="615" y="125" width="235" height="125" class="b"/>
  <text x="732" y="158" text-anchor="middle" class="t h">FILTER BANK</text>
  <text x="732" y="187" text-anchor="middle" class="t p">smooth</text>
  <text x="732" y="213" text-anchor="middle" class="t p">model</text>
  <text x="732" y="239" text-anchor="middle" class="t p">state estimation</text>

  <rect x="895" y="125" width="250" height="125" class="b"/>
  <text x="1020" y="158" text-anchor="middle" class="t h">ENSEMBLE SIGNAL</text>
  <text x="1020" y="187" text-anchor="middle" class="t p">shared trend</text>
  <text x="1020" y="213" text-anchor="middle" class="t p">noise suppression</text>
  <text x="1020" y="239" text-anchor="middle" class="t p">transparent aggregation</text>

  <path d="M290 187H335M570 187H615M850 187H895" class="l"/>

  <rect x="190" y="365" width="250" height="125" class="b"/>
  <text x="315" y="398" text-anchor="middle" class="t h">CAUSAL CONTROL</text>
  <text x="315" y="426" text-anchor="middle" class="t p">past information only</text>
  <text x="315" y="452" text-anchor="middle" class="t p">rolling selection</text>
  <text x="315" y="478" text-anchor="middle" class="t p">chronological split</text>

  <rect x="475" y="365" width="250" height="125" class="b"/>
  <text x="600" y="398" text-anchor="middle" class="t h">PREDICTORS</text>
  <text x="600" y="426" text-anchor="middle" class="t p">support vector machine</text>
  <text x="600" y="452" text-anchor="middle" class="t p">neural network</text>
  <text x="600" y="478" text-anchor="middle" class="t p">market baselines</text>

  <rect x="760" y="365" width="250" height="125" class="b"/>
  <text x="885" y="398" text-anchor="middle" class="t h">MARKET RESPONSE</text>
  <text x="885" y="426" text-anchor="middle" class="t p">return</text>
  <text x="885" y="452" text-anchor="middle" class="t p">volatility</text>
  <text x="885" y="478" text-anchor="middle" class="t p">forecast error</text>

  <path d="M1020 250V300H315V365M1020 250V300H600V365M1020 250V300H885V365" class="l"/>
  <path d="M315 365V310H732V250" class="l"/>
  <rect x="245" y="565" width="710" height="64" class="b"/>
  <text x="600" y="593" text-anchor="middle" class="t h">DESIGN LOGIC</text>
  <text x="600" y="616" text-anchor="middle" class="t p">measure → denoise → predict → test whether information survives</text>
</svg>
