<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#475569"/></marker>
    <style>.title{font:700 26px Arial,sans-serif;fill:#0f172a}.h{font:700 16px Arial,sans-serif;fill:#0f172a}.t{font:14px Arial,sans-serif;fill:#334155}.small{font:12px Arial,sans-serif;fill:#475569}.box{stroke:#64748b;stroke-width:2;rx:12}.arrow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" class="title">Mathematical filtering and prediction pipeline</text>
  <text x="600" y="67" text-anchor="middle" class="small">226,900 articles · 1,217 trading days · causal rolling-window evaluation</text>
  <rect x="40" y="105" width="250" height="185" fill="#dbeafe" class="box"/><text x="60" y="135" class="h">1. News and market inputs</text><text x="60" y="165" class="t">2018–2022 Chinese financial news</text><text x="60" y="188" class="t">Financial-domain segmentation</text><text x="60" y="211" class="t">Dictionary sentiment scoring</text><text x="60" y="234" class="t">CSI 300 / SSE Composite</text><text x="60" y="257" class="t">After-close news → next day</text>
  <rect x="330" y="105" width="250" height="185" fill="#dcfce7" class="box"/><text x="350" y="135" class="h">2. Three raw signals</text><text x="350" y="165" class="t">Sentiment mean μₜ</text><text x="350" y="188" class="t">Dispersion σₜ</text><text x="350" y="211" class="t">Polarity imbalance ρₜ</text><text x="350" y="234" class="t">Daily aggregation</text><text x="350" y="257" class="t">Duplicate threshold: cosine 0.85</text>
  <rect x="620" y="105" width="250" height="185" fill="#fef3c7" class="box"/><text x="640" y="135" class="h">3. Seven causal filters</text><text x="640" y="165" class="t">ES · AR · ARIMA · MA(5)</text><text x="640" y="188" class="t">DWT · one-sided SG · Kalman</text><text x="640" y="211" class="t">Parameters use past only</text><text x="640" y="234" class="t">Rolling training window</text><text x="640" y="257" class="t">No future leakage</text>
  <rect x="910" y="105" width="250" height="185" fill="#fce7f3" class="box"/><text x="930" y="135" class="h">4. Ensemble signal</text><text x="930" y="165" class="t">Equal-weight mean of 7 outputs</text><text x="930" y="188" class="t">Validation-weighted robustness</text><text x="930" y="211" class="t">PCA robustness check</text><text x="930" y="234" class="t">Stable mean level</text><text x="930" y="257" class="t">Lower high-frequency noise</text>
  <path d="M290 198 H330 M580 198 H620 M870 198 H910" class="arrow"/>
  <rect x="110" y="370" width="290" height="190" fill="#ede9fe" class="box"/><text x="130" y="400" class="h">Time-series safeguards</text><text x="130" y="432" class="t">Chronological 60% / 40% split</text><text x="130" y="455" class="t">Training-only hyperparameter CV</text><text x="130" y="478" class="t">Rolling AIC / validation selection</text><text x="130" y="501" class="t">Stationarity tests: ADF + PP</text><text x="130" y="524" class="t">Log returns and volatility target</text>
  <rect x="455" y="370" width="290" height="190" fill="#e0f2fe" class="box"/><text x="475" y="400" class="h">Prediction model matrix</text><text x="475" y="432" class="t">Market-only baselines</text><text x="475" y="455" class="t">SVM: 4 kernels</text><text x="475" y="478" class="t">NN: 10 / 20 / 30 / 40 / 50</text><text x="475" y="501" class="t">Raw vs each filter vs ensemble</text><text x="475" y="524" class="t">RMSE + MAE</text>
  <rect x="800" y="370" width="300" height="190" fill="#dcfce7" class="box"/><text x="820" y="400" class="h">Targets and evidence</text><text x="820" y="432" class="t">CSI 300 log return</text><text x="820" y="455" class="t">20-day realized volatility</text><text x="820" y="478" class="t">Noise SD reduction: 47.8–55.4%</text><text x="820" y="501" class="t">Return RMSE improvement: 5.8%</text><text x="820" y="524" class="t">Volatility RMSE improvement: 16.9%</text>
  <path d="M1035 290 V330 H255 V370 M1035 290 V330 H600 V370 M1035 290 V330 H950 V370" class="arrow"/>
  <rect x="190" y="635" width="820" height="72" fill="#0f172a" rx="14"/><text x="600" y="664" text-anchor="middle" style="font:700 18px Arial,sans-serif;fill:white">Evidence chain: noisy text → causal denoising → leakage-safe features → predictive comparison</text><text x="600" y="688" text-anchor="middle" style="font:13px Arial,sans-serif;fill:#cbd5e1">Best SVM-RBF: return RMSE 0.01338 → 0.01261 · volatility RMSE 0.00706 → 0.00587</text>
</svg>
